[project]
name = "scholar-mcp"
version = "1.0.0"
description = "Unified academic discovery and multi-tier waterfall full-text MCP server with clean Markdown extraction"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "fastmcp>=3.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pypdf>=5.0.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]
medical = [
    "camoufox>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/w8s/scholar-mcp"
Repository = "https://github.com/w8s/scholar-mcp"
Changelog = "https://github.com/w8s/scholar-mcp/blob/main/CHANGELOG.md"
Issues = "https://github.com/w8s/scholar-mcp/issues"

[project.scripts]
scholar-mcp = "scholar_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scholar_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
